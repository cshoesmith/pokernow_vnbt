<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 230px; background: #1f1f24; color: #eee; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #bbb; font-weight: 600; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px 7px; margin-top: 4px;
      background: #2c2c33; color: #eee; border: 1px solid #45454f; border-radius: 4px; font: inherit; }
  </style>
</head>
<body>
  <h1>vNBT Poker</h1>
  <h2>Hide</h2>
  <label><input type="checkbox" id="promoLink"> Promo link</label>
  <label><input type="checkbox" id="chat"> Chat</label>
  <label><input type="checkbox" id="videoControls"> Video / mic controls</label>
  <h2>Table</h2>
  <label><input type="checkbox" id="beerTheme"> Beer table</label>
  <input type="text" id="tableTitle" placeholder="Table title (blank for none)">
  <h2>Panels</h2>
  <label><input type="checkbox" id="stackChart"> Stack chart</label>
  <label><input type="checkbox" id="winOdds"> Win chance</label>
  <label><input type="checkbox" id="winCapture"> Screenshot big hands</label>
  <label><input type="checkbox" id="untappd"> Untappd beer banner</label>
  <script src="popup.js"></script>
</body>
</html>
