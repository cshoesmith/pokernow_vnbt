<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 250px; background: #1f1f24; color: #eee; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    #version { font-size: 12px; font-weight: normal; color: #999; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #bbb; font-weight: 600; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px 7px; margin-top: 4px;
      background: #2c2c33; color: #eee; border: 1px solid #45454f; border-radius: 4px; font: inherit; }
    .row { display: flex; align-items: center; gap: 8px; padding: 2px 0 0 22px; }
    .row input[type="range"] { flex: 1; min-width: 0; }
    button { background: #2c2c33; color: #eee; border: 1px solid #45454f; border-radius: 4px; font: inherit; padding: 3px 10px; cursor: pointer; }
    button:hover { border-color: #6a6a76; }
    #beepStatus { margin: 6px 0 0 22px; font-size: 12px; color: #bbb; }
    #beepStatus:empty { display: none; }
    label.select { cursor: default; }
    select { flex: 1; min-width: 0; background: #2c2c33; color: #eee; border: 1px solid #45454f; border-radius: 4px; font: inherit; padding: 2px 4px; }
    #untappdNames { padding: 0 0 0 22px; }
    #untappdNames .hint { margin: 2px 0 4px; font-size: 12px; color: #bbb; }
    .name-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .name-row input[type="text"] { flex: 1; min-width: 0; margin: 0; padding: 3px 5px; font-size: 12px; }
    .name-row span { color: #888; font-size: 12px; }
    .name-row button { padding: 1px 6px; line-height: 1.2; }
    #addName { font-size: 12px; padding: 2px 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>vNBT Poker <span id="version"></span></h1>
  <h2>Hide</h2>
  <label><input type="checkbox" id="promoLink"> Promo link</label>
  <label><input type="checkbox" id="chat"> Chat</label>
  <label><input type="checkbox" id="videoControls"> Video / mic controls</label>
  <h2>Table</h2>
  <label><input type="checkbox" id="beerTheme"> Beer table</label>
  <input type="text" id="tableTitle" placeholder="Table title (blank for none)">
  <label><input type="checkbox" id="holidayWorkaround"> Holidays workaround</label>
  <label><input type="checkbox" id="winStreak"> Win streak flames</label>
  <label><input type="checkbox" id="crown"> Chip leader crown</label>
  <label class="select">Card backs
    <select id="cardBacks">
      <option value="standard">Poker Now standard</option>
      <option value="mixed">Silhouettes (dealt at random)</option>
      <option value="1">Scarlet</option>
      <option value="2">Velvet</option>
      <option value="3">Blinds</option>
      <option value="4">Jade</option>
      <option value="5">Gold</option>
    </select>
  </label>
  <label title="A TV button on the table opens live TV in its own window, with a channel guide"><input type="checkbox" id="tv"> TV</label>
  <h2>Panels</h2>
  <label><input type="checkbox" id="stackChart"> Stack chart</label>
  <label><input type="checkbox" id="winOdds"> Win chance</label>
  <label><input type="checkbox" id="winCapture"> Screenshot big hands</label>
  <label><input type="checkbox" id="untappd"> Untappd beer banner</label>
  <div id="untappdNames">
    <p class="hint">Players whose Untappd username isn't their Poker Now name:</p>
    <div id="nameRows"></div>
    <button type="button" id="addName">+ Add a player</button>
  </div>
  <h2>Sound</h2>
  <label><input type="checkbox" id="turnBeeps"> Turn timer beeps</label>
  <div class="row">
    <input type="range" id="beepVolume" min="10" max="100" step="5" title="Beep volume">
    <button type="button" id="testBeeps">Test</button>
  </div>
  <p id="beepStatus"></p>
  <script src="popup.js"></script>
</body>
</html>
